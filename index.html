```html
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twan Clicker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #7c3aed, #ec4899, #f59e0b);
      overflow-x: hidden;
    }

    .game {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 25px;
      align-items: center;
      padding: 25px;
    }

    .panel {
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      padding: 22px;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    .score {
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
    }

    .per-click {
      text-align: center;
      opacity: 0.9;
    }

    .center {
      text-align: center;
    }

    #title {
      font-size: 3rem;
      transition: transform 0.15s;
    }

    #twan {
      width: min(50vw, 350px);
      height: min(50vw, 350px);

      border: none;
      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          white,
          #fde68a 15%,
          #f97316 45%,
          #dc2626 75%
        );

      color: white;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 900;

      text-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);

      cursor: pointer;

      box-shadow:
        0 18px 0 #991b1b,
        0 28px 45px rgba(0, 0, 0, 0.3);

      transition: transform 0.08s;
    }

    #twan:active {
      transform: translateY(10px) scale(0.96);

      box-shadow:
        0 8px 0 #991b1b,
        0 18px 30px rgba(0, 0, 0, 0.25);
    }

    .shop-item {
      margin: 15px 0;
    }

    .shop-item button {
      width: 100%;
      padding: 14px;

      border: none;
      border-radius: 15px;

      font-size: 1rem;
      font-weight: bold;

      cursor: pointer;

      background: white;
      color: #4c1d95;

      transition: transform 0.1s;
    }

    .shop-item button:hover:not(:disabled) {
      transform: scale(1.03);
    }

    .shop-item button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .small {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    .emoji-rain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .emoji {
      position: absolute;
      top: -50px;

      animation:
        fall 2.5s linear forwards;
    }

    @keyframes fall {
      to {
        transform:
          translateY(110vh)
          rotate(720deg);

        opacity: 0;
      }
    }

    .floating-number {
      position: fixed;

      pointer-events: none;

      font-size: 2rem;
      font-weight: bold;

      animation: pop 0.8s ease-out forwards;

      z-index: 20;
    }

    @keyframes pop {
      from {
        transform: translate(-50%, 0) scale(0.7);
        opacity: 1;
      }

      to {
        transform: translate(-50%, -100px) scale(1.3);
        opacity: 0;
      }
    }

    @media (max-width: 850px) {
      .game {
        grid-template-columns: 1fr;
      }

      .center {
        order: -1;
      }

      #twan {
        width: 260px;
        height: 260px;
      }
    }
  </style>
</head>

<body>

  <!-- Emoji's die naar beneden vallen -->
  <div class="emoji-rain" id="emojiRain"></div>


  <main class="game">

    <!-- LINKER KANT -->
    <section class="panel">

      <div class="score" id="score">
        0 kliks
      </div>

      <p class="per-click" id="perClick">
        1 klik per keer
      </p>

      <hr>

      <h2>📊 Stats</h2>

      <p>
        👆 Totaal geklikt:
        <b id="total">0</b>
      </p>

      <p>
        🤖 Autoklik:
        <b id="autoStatus">uit</b>
      </p>

      <p>
        ✨ Dubbelklik:
        <b id="doubleStatus">uit</b>
      </p>

    </section>


    <!-- MIDDEN -->
    <section class="center">

      <h1 id="title">
        🔥 TWAN 🔥
      </h1>

      <button id="twan">
        TWAN
      </button>

      <p>
        Klik op TWAN! 🎉
      </p>

    </section>


    <!-- RECHTER KANT -->
    <section class="panel">

      <h2>
        🛒 SHOP
      </h2>


      <!-- DUBBEL KLIK -->
      <div class="shop-item">

        <button id="doubleBtn">
          ✨ Dubbelklik — 20 kliks
        </button>

        <p class="small">
          Elke aankoop wordt 2x zo duur.
        </p>

      </div>


      <!-- AUTOKLIK -->
      <div class="shop-item">

        <button id="autoBtn">
          🤖 Autoklik — 200 kliks
        </button>

        <p class="small">
          Eenmalig. Geeft automatisch kliks.
        </p>

      </div>


      <!-- EXTRA KRACHT -->
      <div class="shop-item">

        <button id="powerBtn">
          💪 +1 klik — 10 kliks
        </button>

        <p class="small">
          Geeft 1 extra klik per druk.
        </p>

      </div>

    </section>

  </main>


  <script>

    /* =========================
       SPEL-VARIABELEN
    ========================= */

    let clicks = 0;

    let total = 0;

    let perClick = 1;

    let doubleLevel = 0;

    let autoClick = false;

    let extraPower = 0;

    let titleSize = 1;


    /* =========================
       ELEMENTEN
    ========================= */

    const twan =
      document.getElementById("twan");

    const score =
      document.getElementById("score");

    const perClickText =
      document.getElementById("perClick");

    const totalText =
      document.getElementById("total");

    const autoStatus =
      document.getElementById("autoStatus");

    const doubleStatus =
      document.getElementById("doubleStatus");

    const doubleBtn =
      document.getElementById("doubleBtn");

    const autoBtn =
      document.getElementById("autoBtn");

    const powerBtn =
      document.getElementById("powerBtn");

    const title =
      document.getElementById("title");

    const emojiRain =
      document.getElementById("emojiRain");


    /* =========================
       EMOJI'S
    ========================= */

    const emojis = [
      "🎉",
      "🔥",
      "😂",
      "💥",
      "⭐",
      "🚀",
      "😎",
      "✨",
      "💰",
      "🤑",
      "❤️",
      "🤣",
      "👑",
      "⚡",
      "🍕",
      "🐸",
      "🦄",
      "🥳",
      "💎",
      "🤯"
    ];


    /* =========================
       PRIJS DUBBELKLIK
    ========================= */

    function doubleCost() {

      return 20 * Math.pow(2, doubleLevel);

    }


    /* =========================
       SCHERM UPDATEN
    ========================= */

    function update() {

      score.textContent =
        Math.floor(clicks) + " kliks";


      perClickText.textContent =
        perClick +
        " klik" +
        (perClick === 1 ? "" : "s") +
        " per keer";


      totalText.textContent =
        Math.floor(total);


      autoStatus.textContent =
        autoClick ? "AAN 🤖" : "uit";


      doubleStatus.textContent =
        doubleLevel > 0
          ? "x" + Math.pow(2, doubleLevel) + " ✨"
          : "uit";


      /* Dubbelklik-knop */

      doubleBtn.textContent =
        "✨ Dubbelklik — " +
        doubleCost() +
        " kliks";


      doubleBtn.disabled =
        clicks < doubleCost();


      /* Autoklik-knop */

      if (autoClick) {

        autoBtn.textContent =
          "🤖 Autoklik — GEKOCHT!";

        autoBtn.disabled = true;

      } else {

        autoBtn.textContent =
          "🤖 Autoklik — 200 kliks";

        autoBtn.disabled =
          clicks < 200;

      }


      /* Extra kracht */

      powerBtn.disabled =
        clicks < 10;


      /* Titel groter maken */

      title.style.transform =
        `scale(${titleSize})`;

    }


    /* =========================
       KLIKS TOEVOEGEN
    ========================= */

    function addClicks(amount, x, y) {

      clicks += amount;

      total += amount;


      showFloatingNumber(
        "+" + amount + " 💥",
        x,
        y
      );


      update();

    }


    /* =========================
       EMOJI'S LATEN VALLEN
    ========================= */

    function createEmojiRain() {

      for (let i = 0; i < 15; i++) {

        const emoji =
          document.createElement("span");

        emoji.className = "emoji";

        emoji.textContent =
          emojis[
            Math.floor(
              Math.random() *
              emojis.length
            )
          ];


        emoji.style.left =
          Math.random() * 100 + "vw";


        emoji.style.fontSize =
          (1.2 + Math.random() * 2.5)
          + "rem";


        emoji.style.animationDuration =
          (1.2 + Math.random() * 2)
          + "s";


        emojiRain.appendChild(emoji);


        setTimeout(() => {

          emoji.remove();

        }, 3500);

      }

    }


    /* =========================
       +1 EFFECT
    ========================= */

    function showFloatingNumber(
      text,
      x,
      y
    ) {

      const element =
        document.createElement("div");


      element.className =
        "floating-number";


      element.textContent =
        text;


      element.style.left =
        x + "px";


      element.style.top =
        y + "px";


      document.body.appendChild(
        element
      );


      setTimeout(() => {

        element.remove();

      }, 800);

    }


    /* =========================
       OP TWAN KLIKKEN
    ========================= */

    twan.addEventListener(
      "click",
      function(event) {

        /*
          Basis aantal kliks
          × dubbelklik-upgrades
          + extra kracht
        */

        const amount =
          perClick *
          Math.pow(2, doubleLevel)
          + extraPower;


        addClicks(
          amount,
          event.clientX,
          event.clientY
        );


        /* Naam wordt groter */

        titleSize =
          Math.min(
            1.6,
            titleSize + 0.015
          );


        /* Willekeurige emoji naast TWAN */

        const randomEmoji =
          emojis[
            Math.floor(
              Math.random() *
              emojis.length
            )
          ];


        title.textContent =
          "TWAN " +
          randomEmoji;


        /* Emoji-regen */

        createEmojiRain();

      }
    );


    /* =========================
       DUBBELKLIK KOPEN
    ========================= */

    doubleBtn.addEventListener(
      "click",
      function() {

        const cost =
          doubleCost();


        if (clicks >= cost) {

          clicks -= cost;

          doubleLevel++;

          createEmojiRain();

          update();

        }

      }
    );


    /* =========================
       AUTOKLIK KOPEN
    ========================= */

    autoBtn.addEventListener(
      "click",
      function() {

        if (
          clicks >= 200 &&
          !autoClick
        ) {

          clicks -= 200;

          autoClick = true;

          createEmojiRain();

          update();

        }

      }
    );


    /* =========================
       EXTRA KRACHT KOPEN
    ========================= */

    powerBtn.addEventListener(
      "click",
      function() {

        if (clicks >= 10) {

          clicks -= 10;

          extraPower++;

          update();

        }

      }
    );


    /* =========================
       AUTOKLIKKER
    ========================= */

    setInterval(
      function() {

        if (autoClick) {

          const amount =
            perClick *
            Math.pow(2, doubleLevel)
            + extraPower;


          addClicks(
            amount,
            window.innerWidth / 2,
            150
          );

        }

      },
      1000
    );


    /* =========================
       START
    ========================= */

    update();

  </script>

</body>
</html>
```
