```html
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>TWAN!</title>

    <style>
        /* Achtergrond van de website */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6a00ff, #00d4ff);
            font-family: Arial, sans-serif;
        }

        /* De knop */
        button {
            padding: 20px 40px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            background-color: #ffcc00;
            color: #222;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        /* Effect wanneer je met je muis over de knop gaat */
        button:hover {
            transform: scale(1.1);
            background-color: #ff6600;
            color: white;
        }

        /* Het grote TWAN-scherm */
        #twan {
            display: none;
            position: fixed;
            inset: 0;
            background-color: #ff006e;
            color: white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
        }

        /* Het woord TWAN */
        #twan h1 {
            margin: 0;
            font-size: 20vw;
            font-weight: 900;
            text-shadow: 10px 10px 0 #000;
            animation: groot 0.5s ease-out;
        }

        /* Animatie waardoor TWAN groot in beeld komt */
        @keyframes groot {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Terug-knop */
        #terug {
            padding: 12px 25px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: white;
            color: #ff006e;
        }
    </style>
</head>

<body>

    <!-- De normale knop -->
    <button onclick="toonTwan()">
        KLIK HIER 👀
    </button>


    <!-- Dit verschijnt zodra je op de knop klikt -->
    <div id="twan">

        <h1>TWAN</h1>

        <button id="terug" onclick="verbergTwan()">
            Terug
        </button>

    </div>


    <script>
        /* Deze functie maakt TWAN zichtbaar */
        function toonTwan() {
            document.getElementById("twan").style.display = "flex";
        }

        /* Deze functie verbergt TWAN weer */
        function verbergTwan() {
            document.getElementById("twan").style.display = "none";
        }
    </script>

</body>
</html>
```
