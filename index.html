```html
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twan Clicker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #111827, #4c1d95, #7c3aed);
      overflow: hidden;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* Bovenbalk */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .top-left,
    .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .small-button,
    .shop-button {
      border: none;
      padding: 11px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.15);
      color: white;
      font-weight: bold;
    }

    .small-button:hover,
    .shop-button:hover {
      background: rgba(255,255,255,0.25);
    }

    /* Score */
    .score-container {
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 2;
    }

    #score {
      font-size: 50px;
      font-weight: 900;
    }

    .score-label {
      opacity: 0.8;
    }

    /* Twan knop */
    .click-area {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #twanButton {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 8px solid rgba(255,255,255,0.4);
      background: radial-gradient(
        circle at 35% 30%,
        #f472b6,
        #9333ea 55%,
        #4c1d95
      );
      color: white;
      font-size: 52px;
      font-weight: 900;
      box-shadow:
        0 20px 70px rgba(0,0,0,0.4),
        inset 0 0 30px rgba(255,255,255,0.2);
      transition: transform 0.08s;
    }

    #twanButton:active {
      transform: scale(0.9);
    }

    /* Winkel */
    .shop {
      position: fixed;
      top: 85px;
      right: 20px;
      width: 350px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
      background: rgba(17,24,39,0.97);
      border-radius: 18px;
      box-shadow: 0 20px 70px rgba(0,0,0,0.5);
      z-index: 20;
    }

    .hidden {
      display: none !important;
    }

    .shop h2 {
      margin-top: 0;
    }

    .upgrade {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      text-align: left;
      color: white;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
    }

    .upgrade:hover:not(:disabled) {
      background: rgba(255,255,255,0.16);
    }

    .upgrade:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .upgrade strong {
      display: block;
      margin-bottom: 5px;
    }

    /* Scorebord */
    .leaderboard {
      position: fixed;
      left: 20px;
      bottom: 20px;
      width: 300px;
      max-height: 300px;
      overflow-y: auto;
      padding: 16px;
      background: rgba(17,24,39,0.85);
      border-radius: 16px;
      z-index: 5;
    }

    .leaderboard h3 {
      margin-top: 0;
    }

    .leader-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    /* Modals */
    .modal-background {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.75);
      z-index: 100;
    }

    .modal {
      width: min(420px, 90%);
      padding: 25px;
      background: #111827;
      border-radius: 18px;
      box-shadow: 0 30px 100px rgba(0,0,0,0.6);
    }

    .modal h2 {
      margin-top: 0;
    }

    .modal input {
      width: 100%;
      padding: 13px;
      margin: 8px 0 12px;
      color: white;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
    }

    .primary-button {
      width: 100%;
      padding: 13px;
      color: white;
      background: #8b5cf6;
      border: none;
      border-radius: 10px;
      font-weight: bold;
    }

    /* Vaseline event */
    #vaselineEvent {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: rgba(0,0,0,0.8);
      z-index: 80;
    }

    #vaselineImage {
      width: min(75vw, 650px);
      max-height: 75vh;
      object-fit: contain;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
      cursor: pointer;
    }

    .vaseline-text {
      margin-top: 15px;
      font-size: 24px;
      font-weight: bold;
    }

    /* Melding */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      padding: 13px 20px;
      background: #10b981;
      border-radius: 30px;
      font-weight: bold;
      z-index: 200;
    }

    @media (max-width: 700px) {
      #twanButton {
        width: 190px;
        height: 190px;
        font-size: 42px;
      }

      .leaderboard {
        width: 220px;
        font-size: 13px;
      }

      .shop {
        width: calc(100% - 30px);
        right: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- BOVENBALK -->
  <header class="topbar">
    <div class="top-left">
      <button class="small-button" id="accountButton">
        👤 Account
      </button>

      <span id="playerName">Gast</span>
    </div>

    <div class="top-right">
      <button class="shop-button" id="shopButton">
        🛒 Winkel
      </button>
    </div>
  </header>


  <!-- SCORE -->
  <div class="score-container">
    <div id="score">0</div>
    <div class="score-label">kliks</div>
  </div>


  <!-- HOOFDKNOP -->
  <main class="click-area">
    <button id="twanButton">
      twan
    </button>
  </main>


  <!-- WINKEL -->
  <aside class="shop hidden" id="shop">

    <h2>🛒 Winkel</h2>

    <button
      class="upgrade"
      id="doubleUpgrade"
    >
      <strong id="doubleTitle">
        Dubbel klik — 20 kliks
      </strong>

      Per keer klikken krijg je 2 kliks.
    </button>


    <button
      class="upgrade"
      id="autoUpgrade"
    >
      <strong id="autoTitle">
        Autoklik — 200 kliks
      </strong>

      De autoklik klikt automatisch.
      Iedere aankoop maakt hem sneller.
    </button>


    <p id="autoInfo">
      Autokliks: 0
    </p>

  </aside>


  <!-- SCOREBORD -->
  <section class="leaderboard">

    <h3>🏆 Scorebord</h3>

    <div id="leaderboardList">
      Nog geen spelers.
    </div>

  </section>


  <!-- NAAM INVULLEN -->
  <div
    class="modal-background hidden"
    id="nameModal"
  >

    <div class="modal">

      <h2>Welkom bij Twan Clicker!</h2>

      <p>
        Vul eerst je naam in.
      </p>

      <input
        id="nameInput"
        maxlength="20"
        placeholder="Jouw naam"
      >

      <button
        class="primary-button"
        id="startButton"
      >
        Start met klikken
      </button>

    </div>

  </div>


  <!-- ACCOUNT -->
  <div
    class="modal-background hidden"
    id="accountModal"
  >

    <div class="modal">

      <h2>👤 Account</h2>

      <p>
        Je naam en score worden automatisch op deze
        browser opgeslagen.
      </p>

      <input
        id="accountNameInput"
        maxlength="20"
        placeholder="Jouw naam"
      >

      <button
        class="primary-button"
        id="saveAccountButton"
      >
        Naam opslaan
      </button>

      <br><br>

      <button
        class="small-button"
        style="width:100%"
        id="closeAccountButton"
      >
        Sluiten
      </button>

    </div>

  </div>


  <!-- VASELINE EVENT -->
  <div
    id="vaselineEvent"
    class="hidden"
  >

    <img
      id="vaselineImage"
      alt="Grote pot Vaseline"
      src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Vaseline-petroleum-jelly.jpg/640px-Vaseline-petroleum-jelly.jpg"
    >

    <div class="vaseline-text">
      🧴 KLIK OP DE VASELINE EN VERDUBBEL JE SCORE!
    </div>

  </div>


  <script>

    /*
      ==========================================
      TWAN CLICKER
      ==========================================
    */

    const SAVE_KEY = "twanClickerSave";
    const SCOREBOARD_KEY = "twanClickerScoreboard";


    let game = {
      name: "",
      score: 0,

      // Dubbelklik
      doubleClick: false,

      // Aantal autoklik upgrades
      autoClicks: 0,

      // Eerste prijs is 200
      autoCost: 200
    };


    /*
      ELEMENTEN
    */

    const scoreElement =
      document.getElementById("score");

    const playerNameElement =
      document.getElementById("playerName");

    const twanButton =
      document.getElementById("twanButton");

    const shopButton =
      document.getElementById("shopButton");

    const shop =
      document.getElementById("shop");

    const doubleUpgrade =
      document.getElementById("doubleUpgrade");

    const autoUpgrade =
      document.getElementById("autoUpgrade");

    const autoTitle =
      document.getElementById("autoTitle");

    const doubleTitle =
      document.getElementById("doubleTitle");

    const autoInfo =
      document.getElementById("autoInfo");

    const nameModal =
      document.getElementById("nameModal");

    const accountModal =
      document.getElementById("accountModal");

    const leaderboardList =
      document.getElementById("leaderboardList");


    /*
      OPSLAAN
    */

    function saveGame() {

      localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(game)
      );

      updateScoreboard();
    }


    /*
      LADEN
    */

    function loadGame() {

      const saved =
        localStorage.getItem(SAVE_KEY);

      if (saved) {

        try {

          const parsed =
            JSON.parse(saved);

          game = {
            ...game,
            ...parsed
          };

        } catch (error) {

          console.log(
            "Opslaan kon niet worden geladen."
          );

        }

      }
    }


    /*
      SCOREBORD OPHALEN
    */

    function getScoreboard() {

      const saved =
        localStorage.getItem(SCOREBOARD_KEY);

      if (!saved) {
        return {};
      }

      try {
        return JSON.parse(saved);
      } catch {
        return {};
      }
    }


    /*
      SCOREBORD UPDATEN
    */

    function updateScoreboard() {

      if (!game.name) {
        return;
      }

      const scoreboard =
        getScoreboard();


      /*
        Bewaar de hoogste score
      */

      if (
        !scoreboard[game.name] ||
        game.score > scoreboard[game.name]
      ) {

        scoreboard[game.name] =
          Math.floor(game.score);

      }


      localStorage.setItem(
        SCOREBOARD_KEY,
        JSON.stringify(scoreboard)
      );


      /*
        Sorteer spelers
      */

      const players =
        Object.entries(scoreboard)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);


      if (players.length === 0) {

        leaderboardList.innerHTML =
          "Nog geen spelers.";

        return;
      }


      leaderboardList.innerHTML =
        players
        .map((player, index) => {

          return `
            <div class="leader-row">

              <span>
                ${index + 1}.
                ${escapeHTML(player[0])}
              </span>

              <strong>
                ${player[1]}
              </strong>

            </div>
          `;

        })
        .join("");
    }


    /*
      HTML VEILIG MAKEN
    */

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }


    /*
      SCHERM UPDATEN
    */

    function render() {

      scoreElement.textContent =
        Math.floor(game.score);

      playerNameElement.textContent =
        game.name || "Gast";


      /*
        Dubbelklik knop
      */

      if (game.doubleClick) {

        doubleTitle.textContent =
          "Dubbel klik — GEKOCHT ✓";

        doubleUpgrade.disabled = true;

      } else {

        doubleTitle.textContent =
          "Dubbel klik — 20 kliks";

        doubleUpgrade.disabled =
          game.score < 20;

      }


      /*
        Autoklik
      */

      autoTitle.textContent =
        `Autoklik — ${game.autoCost} kliks`;

      autoUpgrade.disabled =
        game.score < game.autoCost;


      autoInfo.textContent =
        `Autokliks: ${game.autoClicks}`;
    }


    /*
      KLIKKEN
    */

    function clickTwan() {

      if (game.doubleClick) {

        game.score += 2;

      } else {

        game.score += 1;

      }

      saveGame();
      render();
    }


    twanButton.addEventListener(
      "click",
      clickTwan
    );


    /*
      WINKEL OPENEN
    */

    shopButton.addEventListener(
      "click",
      () => {

        shop.classList.toggle("hidden");

      }
    );


    /*
      DUBBEL KLIK KOPEN
    */

    doubleUpgrade.addEventListener(
      "click",
      () => {

        if (game.doubleClick) {
          return;
        }

        if (game.score < 20) {
          return;
        }


        game.score -= 20;

        game.doubleClick = true;


        saveGame();
        render();

        showMessage(
          "Dubbel klik gekocht! 🎉"
        );

      }
    );


    /*
      AUTOKLIK KOPEN
    */

    autoUpgrade.addEventListener(
      "click",
      () => {

        if (game.score < game.autoCost) {
          return;
        }


        game.score -= game.autoCost;

        game.autoClicks++;


        /*
          Prijzen:

          1e = 200
          2e = 1000
          3e = 2000
          4e = 4000
          5e = 8000
          enz.
        */

        if (game.autoCost === 200) {

          game.autoCost = 1000;

        } else {

          game.autoCost *= 2;

        }


        saveGame();
        render();

        showMessage(
          "Autoklik gekocht! 🤖"
        );

      }
    );


    /*
      AUTOKLIKKER
      --------------------------
      Iedere seconde worden er
      zoveel kliks toegevoegd als
      je autokliks hebt.
    */

    setInterval(
      () => {

        if (game.autoClicks > 0) {

          game.score +=
            game.autoClicks;

          saveGame();
          render();

        }

      },
      1000
    );


    /*
      ACCOUNT KNOP
    */

    document
      .getElementById("accountButton")
      .addEventListener(
        "click",
        () => {

          document
            .getElementById("accountNameInput")
            .value = game.name;

          accountModal
            .classList
            .remove("hidden");

        }
      );


    /*
      ACCOUNT SLUITEN
    */

    document
      .getElementById("closeAccountButton")
      .addEventListener(
        "click",
        () => {

          accountModal
            .classList
            .add("hidden");

        }
      );


    /*
      ACCOUNT NAAM OPSLAAN
    */

    document
      .getElementById("saveAccountButton")
      .addEventListener(
        "click",
        () => {

          const name =
            document
              .getElementById("accountNameInput")
              .value
              .trim();


          if (!name) {
            return;
          }


          game.name = name;

          saveGame();
          render();


          accountModal
            .classList
            .add("hidden");


          showMessage(
            "Naam opgeslagen! 👤"
          );

        }
      );


    /*
      EERSTE NAAM INVULLEN
    */

    document
      .getElementById("startButton")
      .addEventListener(
        "click",
        () => {

          const name =
            document
              .getElementById("nameInput")
              .value
              .trim();


          if (!name) {
            return;
          }


          game.name = name;

          saveGame();
          render();


          nameModal
            .classList
            .add("hidden");

        }
      );


    /*
      ENTER BIJ NAAM
    */

    document
      .getElementById("nameInput")
      .addEventListener(
        "keydown",
        event => {

          if (event.key === "Enter") {

            document
              .getElementById("startButton")
              .click();

          }

        }
      );


    /*
      MELDING
    */

    function showMessage(message) {

      const old =
        document.querySelector(".toast");

      if (old) {
        old.remove();
      }


      const toast =
        document.createElement("div");

      toast.className =
        "toast";

      toast.textContent =
        message;


      document.body.appendChild(toast);


      setTimeout(
        () => {

          toast.remove();

        },
        2500
      );
    }


    /*
      VASELINE EVENT
      --------------------------
      Iedere 60 seconden.
    */

    function showVaseline() {

      if (!game.name) {
        return;
      }


      document
        .getElementById("vaselineEvent")
        .classList
        .remove("hidden");
    }


    setInterval(
      showVaseline,
      60000
    );


    /*
      VASELINE KLIKKEN
      --------------------------
      Score x2
    */

    document
      .getElementById("vaselineImage")
      .addEventListener(
        "click",
        () => {

          game.score *= 2;

          saveGame();
          render();


          document
            .getElementById("vaselineEvent")
            .classList
            .add("hidden");


          showMessage(
            "🧴 Je score is verdubbeld!"
          );

        }
      );


    /*
      START
    */

    loadGame();
    render();
    updateScoreboard();


    /*
      Als er nog geen naam is,
      moet de speler er één invullen.
    */

    if (!game.name) {

      nameModal
        .classList
        .remove("hidden");

    }

  </script>

</body>
</html>
```
